<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080e27">
<title>ほしのしずく ✦ ふわっと、びゅーん！</title>
<style>
:root {color-scheme: dark; --line:rgba(207,225,255,.23); --muted:#becde9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#f1f7ff;background:#080d24}
#app{position:fixed;inset:0;isolation:isolate;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 49% 41%,#252d5a 0%,#171d3e 47%,#090f28 76%,#060a19 100%)}
#app::before{content:"";position:absolute;inset:-30%;pointer-events:none;z-index:-1;background:radial-gradient(circle at 20% 62%,rgba(43,204,243,.10),transparent 33%),radial-gradient(circle at 76% 45%,rgba(248,105,202,.09),transparent 32%);animation:aurora 18s ease-in-out infinite alternate}
@keyframes aurora{from{transform:translate(-2%,1%) rotate(-4deg)}to{transform:translate(3%,-3%) rotate(4deg)}}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}
#play-label{position:absolute;top:calc(env(safe-area-inset-top) + 24px);left:15px;right:15px;text-align:center;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.5s}
#play-label h1{font-size:clamp(21px,6vw,31px);font-weight:700;letter-spacing:.14em;margin:0;text-shadow:0 0 28px #7fa3d8}
#play-label p{font-size:13px;letter-spacing:.09em;color:#bcd2ed;margin:10px 0 0}
#play-label.visible{opacity:.94}
#setup{position:absolute;z-index:3;left:15px;right:15px;top:50%;transform:translateY(-50%);margin:auto;max-width:430px;max-height:calc(100dvh - 32px);overflow:auto;overscroll-behavior:contain;padding:23px 22px 19px;border:1px solid var(--line);border-radius:27px;background:rgba(16,23,49,.89);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 25px 60px rgba(0,0,0,.33)}
#setup[hidden]{display:none}
.kicker{text-align:center;color:#c7d9f5;letter-spacing:.22em;font-size:11px;margin:0 0 7px}
#setup h2{text-align:center;font-size:clamp(23px,6vw,28px);letter-spacing:.11em;margin:0;font-weight:760}
.intro{text-align:center;font-size:13px;line-height:1.8;color:#c2d6ee;margin:9px 0 16px}
.field{border-top:1px solid rgba(207,225,255,.14);padding-top:14px;margin-top:12px}
.field h3{font-size:13px;margin:0 0 10px;font-weight:650;color:#e1edff}
.palette-buttons{display:flex;gap:9px}
.palette{border:1px solid rgba(255,255,255,.22);border-radius:12px;min-width:0;flex:1;height:42px;color:#fff;font-size:12px;font-weight:680;cursor:pointer}
.palette[aria-pressed="true"]{outline:2px solid white;outline-offset:2px}
.palette[data-palette="rainbow"]{background:linear-gradient(120deg,#28a9eb,#b579f4,#fa8da5,#f8c26b)}
.palette[data-palette="ocean"]{background:linear-gradient(120deg,#1553d2,#26b0d5,#70eec8)}
.palette[data-palette="sakura"]{background:linear-gradient(120deg,#9661e2,#ea80b6,#ffaabd)}
.power-buttons{display:flex;gap:10px}
.power{flex:1;min-height:40px;padding:8px;border-radius:12px;background:#1e3459;color:#deedff;border:1px solid rgba(201,224,255,.34);font-size:13px;font-weight:750;cursor:pointer}
.power[aria-pressed="true"]{background:linear-gradient(110deg,#347cc0,#9b4fbb);outline:2px solid #e0f7ff;outline-offset:1px}
button{font-family:inherit;touch-action:manipulation}
.action{display:block;width:100%;min-height:48px;padding:11px 12px;border:1px solid rgba(179,218,255,.40);border-radius:13px;background:linear-gradient(100deg,#2976bb,#805cce);color:white;font-size:14px;font-weight:750;cursor:pointer}
.action:disabled{opacity:.42;cursor:not-allowed}
.action.secondary{background:linear-gradient(100deg,#246fa0,#298f9c)}
.status{font-size:12px;min-height:37px;line-height:1.55;color:var(--muted);margin:10px 0 0}
.status[data-state="ok"]{color:#a6f5e6}
.status[data-state="error"]{color:#ffd4bd}
.guide{font-size:11px;line-height:1.7;color:#bdd0ee;margin:11px 0 0}
.guide strong{color:#f4f6ff}
#done{margin-top:13px}
#done[hidden]{display:none}
#after-note{font-size:11px;color:#b7cbe6;line-height:1.65;margin:10px 0 0;text-align:center}
@media(max-height:570px){#setup{top:10px;transform:none}#play-label{top:15px}}
@media(prefers-reduced-motion:reduce){#app::before{animation:none}#play-label{transition:none}}
</style>
</head>
<body>
<main id="app" aria-label="スマホを傾けたり優しく揺らすと光の粒が流れる遊び">
  <canvas id="canvas" aria-label="傾きや揺れで動く、光る粒のアニメーション"></canvas>
  <div id="play-label" aria-hidden="true"><h1>✦ ほしのしずく ✦</h1><p>かたむけて ✦ ふわっと シェイク</p></div>
  <section id="setup" aria-label="大人用の初期設定">
    <p class="kicker">おとなの じゅんび</p>
    <h2>✦ ほしのしずく ✦</h2>
    <p class="intro">ちょっとかたむけて ビューン！<br>やさしく揺らして キラキラ大旋回！</p>
    <div class="field">
      <h3>しずくの色</h3>
      <div class="palette-buttons" role="group" aria-label="しずくの色">
        <button type="button" class="palette" data-palette="rainbow" aria-pressed="true">にじいろ</button>
        <button type="button" class="palette" data-palette="ocean" aria-pressed="false">うみ</button>
        <button type="button" class="palette" data-palette="sakura" aria-pressed="false">さくら</button>
      </div>
    </div>
    <div class="field">
      <h3>動きのはげしさ</h3>
      <div class="power-buttons" role="group" aria-label="動きのはげしさ">
        <button type="button" class="power" data-power="lively" aria-pressed="true">✨ はで</button>
        <button type="button" class="power" data-power="wild" aria-pressed="false">🌟 もっとはで</button>
      </div>
    </div>
    <div class="field">
      <h3>① スマホのセンサーを許可</h3>
      <button type="button" id="sensor-btn" class="action">📱 傾き・揺れセンサーを有効にする</button>
      <p id="sensor-status" class="status" role="status" aria-live="polite">この操作は、アクセスガイドを始める前に大人が行ってください。</p>
    </div>
    <div class="field" id="done" hidden>
      <h3>② あそぶ画面に切り替え</h3>
      <button type="button" id="play-btn" class="action secondary">✨ あそぶ画面にする</button>
      <p class="guide">画面が切り替わったら、アクセスガイドで <strong>「タッチ」をオフ／「モーション」は許可</strong> にしてください。設定画面はページを再読み込みすると戻ります。</p>
    </div>
    <p id="after-note">音なし・広告なし・通信なし。遊ぶ画面ではタップやスワイプに反応しません。</p>
  </section>
</main>
<script>
(() => {'use strict';
  const app=document.getElementById('app');
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d',{alpha:true});
  const setup=document.getElementById('setup');
  const sensorBtn=document.getElementById('sensor-btn');
  const sensorStatus=document.getElementById('sensor-status');
  const done=document.getElementById('done');
  const playBtn=document.getElementById('play-btn');
  const playLabel=document.getElementById('play-label');
  const PALETTES={rainbow:[185,205,265,320,35],ocean:[175,193,208,164,226],sakura:[282,314,337,23,300]};
  const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let W=0,H=0,DPR=1,particles=[],stars=[],sprites={},palette='rainbow',motionPower=1;
  let gravityX=0,gravityY=.17,targetGX=0,targetGY=.17;
  let gustX=0,gustY=0,shakeEnergy=0,swirlDirection=1,swirlPhase=0;
  let tiltSeen=false,motionSeen=false,lastTiltAt=0,lastMotionAt=0;
  let sensorsArmed=false,playing=false,lastFrame=0,lastBurstAt=0;
  let lastShakeX=0,lastShakeY=0,lastShakeZ=0,hasShakeSample=false;
  let filteredGravityX=0,filteredGravityY=0,filteredGravityZ=0,gravitySampleReady=false;
  const isReducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

  function makeSprite(hue){
    const c=document.createElement('canvas');c.width=c.height=72;
    const cx=c.getContext('2d');
    const g=cx.createRadialGradient(36,36,1,36,36,36);
    g.addColorStop(0,`hsla(${hue},100%,99%,.95)`);
    g.addColorStop(.11,`hsla(${hue},100%,89%,.94)`);
    g.addColorStop(.28,`hsla(${hue},100%,69%,.78)`);
    g.addColorStop(.51,`hsla(${hue},100%,54%,.24)`);
    g.addColorStop(1,`hsla(${hue},100%,50%,0)`);
    cx.fillStyle=g;cx.fillRect(0,0,72,72);return c;
  }
  function rebuildSprites(){sprites={};for(const hue of PALETTES[palette])sprites[hue]=makeSprite(hue)}
  function addParticle(x,y){
    const hues=PALETTES[palette];
    particles.push({x,y,vx:rand(-1.35,1.35),vy:rand(-1.35,1.35),r:rand(3.3,5.5),lightness:rand(.84,1.22),h:hues[(Math.random()*hues.length)|0],phase:rand(0,6.28)});
  }
  function resize(){
    const oldW=W,oldH=H;
    W=app.clientWidth||innerWidth;H=app.clientHeight||innerHeight;
    DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.floor(W*DPR));canvas.height=Math.max(1,Math.floor(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
    stars=Array.from({length:clamp(Math.round(W*H/6200),30,130)},()=>({x:rand(0,W),y:rand(0,H),r:rand(.4,1.55),phase:rand(0,7)}));
    if(!particles.length){
      const count=clamp(Math.round(W*H/940),290,440);
      for(let i=0;i<count;i++)addParticle(rand(W*.21,W*.79),rand(H*.31,H*.73));
    }else{
      for(const p of particles){p.x=clamp(p.x*(oldW?W/oldW:1),p.r,W-p.r);p.y=clamp(p.y*(oldH?H/oldH:1),p.r,H-p.r)}
    }
  }
  function setPalette(value){
    palette=value;rebuildSprites();const hues=PALETTES[value];
    particles.forEach((p,i)=>p.h=hues[i%hues.length]);
    document.querySelectorAll('.palette').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.palette===value)));
  }
  document.querySelectorAll('.palette').forEach(btn=>btn.addEventListener('click',()=>setPalette(btn.dataset.palette)));
  document.querySelectorAll('.power').forEach(btn=>btn.addEventListener('click',()=>{
    motionPower=btn.dataset.power==='wild'?1.5:1;
    document.querySelectorAll('.power').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
  }));

  function screenAngle(){
    const a=window.screen&&screen.orientation&&Number.isFinite(screen.orientation.angle)?screen.orientation.angle:(window.orientation||0);
    return ((a%360)+360)%360;
  }
  function screenVector(x,y){
    const a=screenAngle();
    if(a===90)return [y,-x];
    if(a===270)return [-y,x];
    if(a===180)return [-x,-y];
    return [x,y];
  }
  function onOrientation(e){
    if(!sensorsArmed||!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;
    tiltSeen=true;lastTiltAt=performance.now();
    const [x,y]=screenVector(Math.sin(e.gamma*Math.PI/180),Math.sin(e.beta*Math.PI/180));
    // Larger gravity gain makes even a 5-10° tilt immediately visible.
    const gx=clamp(x*1.40,-1.40,1.40);
    const gy=clamp(y*1.32+.17,-1.30,1.48);
    const delta=Math.hypot(gx-targetGX,gy-targetGY);
    targetGX=gx;targetGY=gy;
    // Quick tilts stir the glitter even without a working linear accelerometer.
    if(delta>.075){
      const kick=clamp((delta-.06)*3.2,0,.92)*motionPower;
      gustX=clamp(gustX+(gx-gravityX)*kick*.45,-3.5,3.5);
      gustY=clamp(gustY+(gy-gravityY)*kick*.45,-3.5,3.5);
      shakeEnergy=Math.max(shakeEnergy,kick*.55);
    }
    sensorReady();
  }
  function onMotion(e){
    if(!sensorsArmed)return;
    const now=performance.now();
    let acceleration=e.acceleration;
    const full=e.accelerationIncludingGravity;
    if(full&&Number.isFinite(full.x)&&Number.isFinite(full.y)&&Number.isFinite(full.z)){
      if(!gravitySampleReady){filteredGravityX=full.x;filteredGravityY=full.y;filteredGravityZ=full.z;gravitySampleReady=true}
      // Gravitational low-pass: fallback if the browser doesn't report linear acceleration.
      filteredGravityX=filteredGravityX*.94+full.x*.06;
      filteredGravityY=filteredGravityY*.94+full.y*.06;
      filteredGravityZ=filteredGravityZ*.94+full.z*.06;
      if(!tiltSeen||now-lastTiltAt>650){
        const [x,y]=screenVector(full.x/9.81,-full.y/9.81);
        targetGX=clamp(x*1.38,-1.38,1.38);
        targetGY=clamp(y*1.38+.17,-1.29,1.46);
      }
      if(!acceleration||![acceleration.x,acceleration.y,acceleration.z].every(Number.isFinite)){
        acceleration={x:full.x-filteredGravityX,y:full.y-filteredGravityY,z:full.z-filteredGravityZ};
      }
    }
    const valid=acceleration&&[acceleration.x,acceleration.y,acceleration.z].every(Number.isFinite);
    if(!valid&&!gravitySampleReady)return;
    motionSeen=true;lastMotionAt=now;sensorReady();
    if(!valid)return;
    // Remove gravity before measuring shakes. Even gentle movements should be fun.
    const ax=clamp(acceleration.x,-18,18),ay=clamp(acceleration.y,-18,18),az=clamp(acceleration.z,-18,18);
    const mag=Math.hypot(ax,ay,az);
    const jerk=hasShakeSample?Math.hypot(ax-lastShakeX,ay-lastShakeY,az-lastShakeZ):0;
    lastShakeX=ax;lastShakeY=ay;lastShakeZ=az;hasShakeSample=true;
    const energy=clamp((Math.max(mag*.94,jerk*.63)-.22)/2.25,0,1.35);
    if(energy<.065)return;
    // Counter-movement lag, similar to light confetti suspended inside the phone.
    const [screenX,screenY]=screenVector(-ax,ay);
    const power=motionPower*(isReducedMotion?.62:1);
    gustX=clamp(gustX+screenX*.10*power,-2.8,2.8);
    gustY=clamp(gustY+screenY*.10*power,-2.8,2.8);
    shakeEnergy=clamp(Math.max(shakeEnergy,energy*power),0,2.1);
    if(now-lastBurstAt>85){
      lastBurstAt=now;
      swirlDirection*=-1;
      swirlPhase+=rand(.45,1.8);
      // Vary force per particle to create a broad, sparkling dispersal.
      const strength=clamp(energy*power,.08,1.75);
      for(const p of particles){
        const dx=(p.x-W*.5)/Math.max(120,W*.5);
        const dy=(p.y-H*.5)/Math.max(140,H*.5);
        p.vx=clamp(p.vx+screenX*.23*strength+rand(-11.0,11.0)*strength-dx*.6*strength,-24,24);
        p.vy=clamp(p.vy+screenY*.23*strength+rand(-11.0,10.5)*strength-dy*.6*strength,-24,24);
      }
    }
  }
  function sensorReady(){
    if(!sensorsArmed||playing)return;
    if(tiltSeen||motionSeen){
      done.hidden=false;
      sensorStatus.dataset.state='ok';
      sensorStatus.textContent=`センサーを検出しました（傾き：${tiltSeen?'OK':'確認中'}／揺れ：${motionSeen?'OK':'確認中'}）。軽く動かして、粒が反応するか確かめてください。`;
    }
  }
  sensorBtn.addEventListener('click',async()=>{
    if(sensorsArmed)return;
    if(!('DeviceOrientationEvent' in window)&&!('DeviceMotionEvent' in window)){
      sensorStatus.dataset.state='error';sensorStatus.textContent='このブラウザは端末センサーに対応していません。iPhoneのSafariでHTTPSのURLを開いてください。';return;
    }
    sensorBtn.disabled=true;sensorStatus.textContent='センサーの許可を確認しています…';
    try{
      // Request both inside the same direct tap: Safari's activation may expire after await.
      const requests=[];
      if('DeviceOrientationEvent' in window&&typeof DeviceOrientationEvent.requestPermission==='function')requests.push(Promise.resolve(DeviceOrientationEvent.requestPermission()).then(value=>['orientation',value]));
      if('DeviceMotionEvent' in window&&typeof DeviceMotionEvent.requestPermission==='function')requests.push(Promise.resolve(DeviceMotionEvent.requestPermission()).then(value=>['motion',value]));
      const settled=await Promise.allSettled(requests);
      const granted=settled.filter(r=>r.status==='fulfilled'&&r.value[1]==='granted');
      const allDenied=settled.length>0&&!granted.length;
      if(allDenied){sensorBtn.disabled=false;sensorStatus.dataset.state='error';sensorStatus.textContent='傾き・揺れのアクセスが許可されませんでした。SafariのHTTPSページで再度お試しください。';return}
      sensorsArmed=true;
      if('DeviceOrientationEvent' in window)window.addEventListener('deviceorientation',onOrientation,{passive:true});
      if('DeviceMotionEvent' in window)window.addEventListener('devicemotion',onMotion,{passive:true});
      sensorBtn.textContent='✓ センサーの使用を開始しました';
      sensorStatus.textContent='信号を確認しています。iPhoneを少し傾けてください。';
      setTimeout(()=>{
        if(!playing&&sensorsArmed&&!tiltSeen&&!motionSeen){
          sensorStatus.dataset.state='error';
          sensorStatus.textContent='センサー信号が届きません。SafariでHTTPSのURLを開き、「動作と方向へのアクセス」を許可してください。';
          sensorBtn.textContent='センサー待機中（ページ再読込でやり直し）';
        }
      },3500);
    }catch(_){sensorBtn.disabled=false;sensorStatus.dataset.state='error';sensorStatus.textContent='センサーを有効にできません。SafariのHTTPSページで開いてください。';}
  });
  playBtn.addEventListener('click',()=>{
    if(!(tiltSeen||motionSeen))return;
    playing=true;setup.hidden=true;playLabel.classList.add('visible');
    setTimeout(()=>playLabel.classList.remove('visible'),4200);
  });

  const CELL=22;
  function simulate(step,time){
    const power=motionPower*(isReducedMotion?.6:1);
    // Reduce input latency: the whole field turns quickly with a small tilt.
    const follow=1-Math.pow(.76,step);
    gravityX+=(targetGX-gravityX)*follow;
    gravityY+=(targetGY-gravityY)*follow;
    gustX*=Math.pow(.935,step);gustY*=Math.pow(.935,step);
    shakeEnergy*=Math.pow(.969,step);
    if(shakeEnergy<.007)shakeEnergy=0;
    const active=shakeEnergy;
    const prevX=new Float32Array(particles.length),prevY=new Float32Array(particles.length);
    const cx=W*.5,cy=H*.5;
    for(let i=0;i<particles.length;i++){
      const p=particles[i];prevX[i]=p.x;prevY[i]=p.y;
      const dx=p.x-cx,dy=p.y-cy;
      const inv=1/(Math.hypot(dx,dy)+55);
      const shimmer=active*.85;
      const swX=(-dy*inv*swirlDirection+Math.cos(time*.0016+p.phase+swirlPhase)*.32)*shimmer;
      const swY=(dx*inv*swirlDirection+Math.sin(time*.0016+p.phase+swirlPhase)*.32)*shimmer;
      // Light particles have little inertia / no viscous glue; they fly and rebound.
      const drag=Math.pow(active>.08?.988:.981,step);
      // A shake temporarily overcomes gravity and blows the pile into a cloud.
      const gravityDuringShake=1/(1+active*3.2);
      const rimX=Math.max(0,Math.abs(dx)/Math.max(1,W*.5)-.72);
      const rimY=Math.max(0,Math.abs(dy)/Math.max(1,H*.5)-.72);
      const accel=(gravityX*gravityDuringShake+gustX*.23+swX
        -Math.sign(dx)*rimX*rimX*active*1.2+rand(-.48,.48)*active)*power*p.lightness;
      const accelY=(gravityY*gravityDuringShake+gustY*.23+swY
        -Math.sign(dy)*rimY*rimY*active*1.2+rand(-.48,.48)*active)*power*p.lightness;
      p.vx=clamp((p.vx+accel*step)*drag,-24,24);
      p.vy=clamp((p.vy+accelY*step)*drag,-24,24);
      p.x+=p.vx*step;p.y+=p.vy*step;
    }
    // Soft short-range repulsion, but almost no cohesion: particles disperse freely.
    const grid=new Map();
    for(let i=0;i<particles.length;i++){
      const p=particles[i],key=Math.floor(p.x/CELL)+Math.floor(p.y/CELL)*10000;
      let bin=grid.get(key);if(!bin){bin=[];grid.set(key,bin)}bin.push(i);
    }
    for(let i=0;i<particles.length;i++){
      const p=particles[i],cellX=Math.floor(p.x/CELL),cellY=Math.floor(p.y/CELL);
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const bin=grid.get(cellX+ox+(cellY+oy)*10000);if(!bin)continue;
        for(const j of bin){
          if(j<=i)continue;
          const q=particles[j],dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
          if(d2<.001||d2>410)continue;
          const d=Math.sqrt(d2),contact=p.r+q.r+.25;
          if(d<contact){
            const push=(contact-d)*.41, nx=dx/d,ny=dy/d;
            p.x-=nx*push;p.y-=ny*push;q.x+=nx*push;q.y+=ny*push;
          }
        }
      }
    }
    for(let i=0;i<particles.length;i++){
      const p=particles[i];let edge=false;
      // A soft elastic bounce instead of dropping all speed at the frame edge.
      if(p.x<p.r){p.x=p.r;p.vx=Math.abs(p.vx)*.75;edge=true}
      else if(p.x>W-p.r){p.x=W-p.r;p.vx=-Math.abs(p.vx)*.75;edge=true}
      if(p.y<p.r){p.y=p.r;p.vy=Math.abs(p.vy)*.70;edge=true}
      else if(p.y>H-p.r){p.y=H-p.r;p.vy=-Math.abs(p.vy)*.70;edge=true}
      if(!edge){
        p.vx=clamp(p.vx*.74+(p.x-prevX[i])*.26,-24,24);
        p.vy=clamp(p.vy*.74+(p.y-prevY[i])*.26,-24,24);
      }
    }
  }
  function draw(time){
    ctx.clearRect(0,0,W,H);const t=time*.001;
    ctx.save();ctx.fillStyle='#d4edff';
    for(const s of stars){ctx.globalAlpha=.25+.28*(.5+.5*Math.sin(t*.68+s.phase));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
    ctx.restore();
    const burst=Math.min(shakeEnergy,1.5);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    // Each fast-moving speck pulls a translucent comet tail behind itself.
    for(const p of particles){
      const speed=Math.hypot(p.vx,p.vy);
      if(speed<3.6)continue;
      const length=Math.min(38,speed*(.78+burst*.36));
      const inv=1/Math.max(1e-6,speed);
      ctx.strokeStyle=`hsla(${p.h},100%,75%,${Math.min(.53,.17+speed*.016)})`;
      ctx.lineWidth=Math.min(3.4,p.r*.45);
      ctx.beginPath();ctx.moveTo(p.x-p.vx*inv*length,p.y-p.vy*inv*length);
      ctx.lineTo(p.x,p.y);ctx.stroke();
    }
    for(const p of particles){
      const sprite=sprites[p.h];if(!sprite)continue;
      const r=p.r*(4.0+burst*.45);
      ctx.globalAlpha=Math.min(.96,.7+burst*.12);
      ctx.drawImage(sprite,p.x-r,p.y-r,2*r,2*r);
    }
    ctx.restore();
    ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle='#fff';
    for(const p of particles){
      ctx.globalAlpha=Math.min(.75,.45+burst*.11);
      ctx.beginPath();ctx.arc(p.x-p.r*.19,p.y-p.r*.22,p.r*(.32+.075*Math.sin(t*3+p.phase)),0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  function frame(time){
    requestAnimationFrame(frame);
    if(document.hidden){lastFrame=time;return}
    const delta=lastFrame?clamp((time-lastFrame)/16.667,.4,1.6):1;
    lastFrame=time;
    simulate(delta*.5,time);simulate(delta*.5,time);draw(time);
  }
  window.addEventListener('resize',resize,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(resize,180),{passive:true});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  rebuildSprites();resize();requestAnimationFrame(frame);
})();
</script>
</body>
